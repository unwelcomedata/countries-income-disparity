project_name: "countries-income-disparity"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project
  rate_limit_seconds: 1.5            # polite delay between HTTP requests

sources:
  # -------------------------------------------------------------------------
  # World Bank API v2 — World Development Indicators
  # Base: https://api.worldbank.org/v2/country/all/indicator/{CODE}
  # Format: JSON, paginated (per_page=1000 max)
  # License: Creative Commons Attribution 4.0 (CC-BY 4.0)
  # -------------------------------------------------------------------------
  world_bank:
    base_url: "https://api.worldbank.org/v2"
    type: api_json
    date_range: "1960:2025"
    per_page: 1000
    indicators:
      - code: "SP.POP.TOTL"
        name: "Population, total"
      - code: "NY.GDP.PCAP.PP.CD"
        name: "GDP per capita, PPP (current international $)"
      - code: "NY.GDP.PCAP.CD"
        name: "GDP per capita (current US$)"
      - code: "NY.GDP.MKTP.KD.ZG"
        name: "GDP growth (annual %)"
      - code: "SI.POV.GINI"
        name: "Gini index"
      - code: "SP.DYN.LE00.IN"
        name: "Life expectancy at birth, total (years)"
      - code: "SP.DYN.TFRT.IN"
        name: "Fertility rate, total (births per woman)"
      - code: "SP.URB.TOTL.IN.ZS"
        name: "Urban population (% of total)"
      - code: "SL.UEM.TOTL.ZS"
        name: "Unemployment, total (% of labor force, ILO estimate)"
      - code: "SI.POV.DDAY"
        name: "Poverty headcount ratio at $2.15/day (2017 PPP)"
      - code: "SI.POV.LMIC"
        name: "Poverty headcount ratio at $3.65/day (2017 PPP)"
      - code: "FP.CPI.TOTL.ZG"
        name: "Inflation, consumer prices (annual %)"
      - code: "NE.TRD.GNFS.ZS"
        name: "Trade (% of GDP)"
      - code: "IT.NET.USER.ZS"
        name: "Individuals using the Internet (% of population)"
      - code: "EN.ATM.CO2E.PC"
        name: "CO2 emissions (metric tons per capita)"
    notes: >
      World Bank API v2 returns paginated JSON. Each indicator is fetched
      separately for all countries. Aggregates (regions, income groups) are
      returned alongside countries — filter by region != "" for countries only.

  # -------------------------------------------------------------------------
  # ISO 3166-1 Country Codes (reference table)
  # Source: DataHub.io curated CSV (Luke Duncalfe / ISO)
  # -------------------------------------------------------------------------
  iso_countries:
    url: "https://raw.githubusercontent.com/lukes/ISO-3166-Countries-with-Regional-Codes/master/all/all.csv"
    type: csv
    notes: >
      ISO 3166-1 alpha-2, alpha-3, numeric codes plus UN geoscheme
      region and sub-region classifications. ~250 entries including
      territories. Primary key: alpha-3 code.

  # -------------------------------------------------------------------------
  # World Bank Poverty & Inequality Platform (PIP) — welfare-metric flag
  # WDI's SI.POV.GINI doesn't say whether a Gini is income- or consumption-based;
  # PIP (the underlying survey source) does, via `welfare_type`. Pulled to attach
  # the metric type to each Gini observation so cross-country rankings can label
  # by method (the income-vs-consumption comparability hazard in SOURCES.md).
  # Base: https://api.worldbank.org/pip/v1/pip  (free, no key)
  #   country=all&year=all&reporting_level=national&format=json
  # gini is a 0-1 fraction (x100 to compare to WDI SI.POV.GINI). Codes are ISO alpha-3.
  # License: CC-BY 4.0
  # -------------------------------------------------------------------------
  pip:
    base_url: "https://api.worldbank.org/pip/v1/pip"
    type: api_json
    reporting_level: national
    notes: >
      One row per country x survey year with welfare_type (income|consumption),
      gini (0-1), survey metadata. ISO alpha-3 country_code. ~2,500 national
      survey rows across ~170 countries.

  # -------------------------------------------------------------------------
  # UNDP Human Development Index (supplemental, future phase)
  # -------------------------------------------------------------------------
  # undp_hdi:
  #   url: "https://hdr.undp.org/sites/default/files/2023-24/HDR2023-24_Statistical_Annex.xlsx"
  #   type: xlsx
  #   notes: "Annual HDI scores by country. Requires parsing specific sheets."

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true
  strip_pii_columns: []
